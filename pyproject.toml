[project]
name = "extraction-services"
version = "0.1.0"
description = "Standalone document parsing and LLM information extraction services"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.139.0",
    "google-genai>=2.30.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.20.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.2.0",
    "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
