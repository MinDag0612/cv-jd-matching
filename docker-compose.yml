services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: recruitment-user
      POSTGRES_PASSWORD: Ara_123 # ko hardcode password, change it in production
      POSTGRES_DB: recruitmentDB
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "qwen2.5:3b"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_TIMEOUT: 300
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  db_data:
  ollama_data:
